<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zhengtao Gao - Resume</title>
    <link rel="stylesheet" href="./styles/resume.css" />
  </head>
  <body>
    <button class="download-button" type="button" onclick="window.print()">Download PDF</button>
    <main id="resume" class="page"></main>
    <script src="./content/resume-data.js"></script>
    <script>
      const el = document.getElementById("resume");

      function list(items, className = "bullets") {
        return `<ul class="${className}">${items.map((item) => `<li>${item}</li>`).join("")}</ul>`;
      }

      function section(title, icon, body, className = "") {
        return `
          <section class="section ${className}">
            <div class="section-title" data-icon="${icon}">${title}</div>
            <div class="section-line"></div>
            ${body}
          </section>
        `;
      }

      function renderEducation() {
        const data = window.RESUME_DATA;
        return data.education
          .map(
            (item) => `
              <div class="education-item">
                <div>
                  <h3>${item.school}</h3>
                  <div class="education-detail-row">
                    <p>${item.degree}</p>
                    <p class="education-gpa">${item.gpa}</p>
                  </div>
                  <p class="education-award">${item.award}</p>
                </div>
                <div class="date">${item.date}</div>
              </div>
            `
          )
          .join("");
      }

      function renderPublications() {
        const data = window.RESUME_DATA;
        return data.publications
          .map(
            (pub) => `
              <div class="publication">
                <div class="pub-head">
                  <h3 class="pub-title">${pub.title}</h3>
                  <div class="pub-meta">${pub.meta}</div>
                </div>
                ${list(pub.bullets)}
              </div>
            `
          )
          .join("");
      }

      function renderProjects() {
        const data = window.RESUME_DATA;
        return data.projects
          .map(
            (project) => `
              <article class="project">
                <div>
                  <div class="project-head">
                    <h3 class="project-title">${project.title}</h3>
                    <div class="project-tech">${project.tech}</div>
                    <div class="project-date">${project.date}</div>
                  </div>
                  ${list(project.bullets)}
                </div>
              </article>
            `
          )
          .join("");
      }

      function renderSkills() {
        const data = window.RESUME_DATA;
        return list(data.skills, "skill-list");
      }

      function contactIconPath(item) {
        const label = (typeof item === "string" ? item : item.label).toLowerCase();
        if (label.includes("website") || label.includes("homepage") || label.includes("主页")) return "./icons/house.svg";
        if (label.startsWith("github:")) return "./icons/github-brands-solid-full.svg";
        if (label.includes("wechat") || label.includes("微信")) return "./icons/weixin-brands-solid-full.svg";
        if (label.includes("phone") || label.includes("电话")) return "./icons/phone.svg";
        return "./icons/mail.svg";
      }

      function renderContactItem(item) {
        const label = typeof item === "string" ? item : item.label;
        const icon = `<img class="contact-icon" src="${contactIconPath(item)}" alt="" aria-hidden="true" />`;
        const content = `${icon}<span>${label}</span>`;
        if (typeof item === "string") return `<span class="contact-item">${content}</span>`;
        return `<a class="contact-item" href="${item.href}" target="_blank" rel="noreferrer">${content}</a>`;
      }

      function renderResume() {
        const data = window.RESUME_DATA;
        el.innerHTML = `
        <h1 class="name">${data.name}</h1>
        <div class="contact">${data.contact.map(renderContactItem).join("")}</div>
        <p class="summary">${data.summary}</p>
        <div class="rule"></div>

        <div class="top-grid">
          ${section("Education", "◆", renderEducation())}
          ${section("Keywords", "◎", list(data.interests, "compact-list"))}
        </div>

        ${section("Publications", "▣", renderPublications())}
        ${section("Research & Engineering Projects", "▰", renderProjects())}
        ${section("Skills", "⚙", renderSkills(), "skills-section")}
      `;
      }

      function loadPrivateData() {
        const script = document.createElement("script");
        script.src = "./content/resume-private.js";
        script.onload = () => {
          if (window.RESUME_PRIVATE_DATA) {
            window.RESUME_DATA = { ...window.RESUME_DATA, ...window.RESUME_PRIVATE_DATA };
          }
          renderResume();
        };
        script.onerror = renderResume;
        document.head.appendChild(script);
      }

      loadPrivateData();
    </script>
  </body>
</html>
